[project]
name = "light-rl"
version = "0.1.0"
description = "A light-weight RL framework for vision generation models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.40.0",
    "hydra-core>=1.3.6",
    "loguru>=0.7.3",
    "peft>=0.20.0",
    "ray>=2.58.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
lint = [
    "ruff >= 0.6.0"
]

[tool.ruff]
line-length=80
target-version="py312"
